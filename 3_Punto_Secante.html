<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método de la Secante - Calculadora</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --danger: #EF4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            background: var(--card-bg);
            max-width: 900px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 2rem;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        input {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        .full-width {
            grid-column: 1 / -1;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .error {
            color: var(--danger);
            background-color: #FEE2E2;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            border-left: 4px solid var(--danger);
        }
        .table-container {
            overflow-x: auto;
            margin-top: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        th, td {
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:nth-child(even) {
            background-color: #F9FAFB;
        }
        tr:hover {
            background-color: #F3F4F6;
        }
        .note {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Método de la Secante</h1>
        <p class="subtitle">Calculadora de iteraciones con truncamiento a 4 decimales</p>

        <div class="error" id="errorMessage"></div>

        <div class="input-grid">
            <div class="input-group full-width">
                <label for="funcion">Función f(x):</label>
                <input type="text" id="funcion" value="x^2 - x + 6" placeholder="Ej: x^2 - x + 6">
            </div>
            <div class="input-group">
                <label for="x0">Valor inicial x₀:</label>
                <input type="number" id="x0" value="1" step="any">
            </div>
            <div class="input-group">
                <label for="x1">Valor inicial x₁:</label>
                <input type="number" id="x1" value="2" step="any">
            </div>
            <div class="input-group">
                <label for="iteraciones">N° máximo iteraciones:</label>
                <input type="number" id="iteraciones" value="5" min="1" max="50">
            </div>
        </div>

        <button onclick="calcularSecante()">Calcular Iteraciones</button>

        <div class="table-container" id="tableContainer" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Iteración (i)</th>
                        <th>xᵢ₋₁</th>
                        <th>f(xᵢ₋₁)</th>
                        <th>xᵢ</th>
                        <th>f(xᵢ)</th>
                        <th>xᵢ₊₁</th>
                        <th>f(xᵢ₊₁)</th>
                        <th>Error Aprox. (%)</th>
                    </tr>
                </thead>
                <tbody id="resultadoTabla"></tbody>
            </table>
        </div>
        <p class="note" id="notaResultados"></p>
    </div>

    <script>
        // Función para truncar a 4 decimales sin redondear
        function truncar(numero) {
            let numStr = numero.toString();
            if(numStr.includes('e')) {
                numero = Number(numero).toFixed(10);
                numStr = numero.toString();
            }
            const partes = numStr.split('.');
            if (partes.length === 1) return numero.toFixed(4);
            const decimales = (partes[1] + '0000').substring(0, 4);
            return Number(partes[0] + '.' + decimales).toFixed(4);
        }

        function calcularSecante() {
            const funcStr = document.getElementById('funcion').value;
            const x0Input = document.getElementById('x0').value;
            const x1Input = document.getElementById('x1').value;
            const maxIter = parseInt(document.getElementById('iteraciones').value);
            const tbody = document.getElementById('resultadoTabla');
            const tableContainer = document.getElementById('tableContainer');
            const errorDiv = document.getElementById('errorMessage');
            const notaDiv = document.getElementById('notaResultados');

            tbody.innerHTML = '';
            errorDiv.style.display = 'none';
            tableContainer.style.display = 'none';
            notaDiv.innerText = '';

            let x0 = parseFloat(x0Input);
            let x1 = parseFloat(x1Input);

            if (isNaN(x0) || isNaN(x1) || isNaN(maxIter)) {
                errorDiv.innerText = 'Por favor, ingresa valores válidos.';
                errorDiv.style.display = 'block';
                return;
            }

            let funcionCompilada;
            try {
                funcionCompilada = math.compile(funcStr);
            } catch (e) {
                errorDiv.innerText = 'Error en la función. Asegúrate de escribirla bien (ej: x^2 - x + 6).';
                errorDiv.style.display = 'block';
                return;
            }

            function f(x) {
                return funcionCompilada.evaluate({x: x});
            }

            let iteracionesHtml = '';
            
            try {
                for (let i = 1; i <= maxIter; i++) {
                    let fx0 = f(x0);
                    let fx1 = f(x1);

                    if (Math.abs(fx1 - fx0) < 1e-10) {
                        iteracionesHtml += `<tr><td colspan="8" style="color:red;">El método se detuvo por división entre cero (f(xᵢ) - f(xᵢ₋₁) ≈ 0).</td></tr>`;
                        break;
                    }

                    let x2 = x1 - (fx1 * (x1 - x0)) / (fx1 - fx0);
                    let fx2 = f(x2);
                    
                    let errorAprox = Math.abs((x2 - x1) / x2) * 100;

                    iteracionesHtml += `
                        <tr>
                            <td>${i}</td>
                            <td>${truncar(x0)}</td>
                            <td>${truncar(fx0)}</td>
                            <td>${truncar(x1)}</td>
                            <td>${truncar(fx1)}</td>
                            <td><strong>${truncar(x2)}</strong></td>
                            <td>${truncar(fx2)}</td>
                            <td>${truncar(errorAprox)}%</td>
                        </tr>
                    `;

                    x0 = parseFloat(truncar(x1));
                    x1 = parseFloat(truncar(x2));
                    
                    // Prevención de valores extremos
                    if (!isFinite(x2)) break;
                }
                
                tbody.innerHTML = iteracionesHtml;
                tableContainer.style.display = 'block';
                notaDiv.innerText = 'Nota: Los valores están truncados a 4 decimales exactos en cada paso para coincidir con la actividad.';
                
            } catch (e) {
                errorDiv.innerText = 'Ocurrió un error matemático al evaluar la función en las iteraciones.';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
